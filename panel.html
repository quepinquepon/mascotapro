<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de licencias — MascotaPro</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mu:#475569;--br:#0f766e;--bd:#e2e8f0;--rose:#be123c}
  @media (prefers-color-scheme:dark){:root{--bg:#020617;--card:#0f172a;--tx:#f1f5f9;--mu:#94a3b8;--bd:#1e293b}}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;display:grid;gap:16px}
  h1{font-size:1.4rem;margin:8px 0 0}
  section{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:grid;gap:10px}
  h2{font-size:1rem;margin:0}
  label{font-size:.85rem;color:var(--mu)}
  input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:inherit;font:inherit}
  button,a.btn{display:inline-block;padding:12px 16px;border:0;border-radius:12px;background:var(--br);color:#fff;font:600 .95rem system-ui;text-align:center;text-decoration:none;cursor:pointer}
  button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
  button.warn{background:transparent;color:var(--rose);border:1px solid var(--rose)}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
  #code{font:700 1.6rem ui-monospace,monospace;letter-spacing:.04em;text-align:center;padding:14px;border:2px dashed var(--br);border-radius:12px;word-break:break-all}
  .row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
  .item{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--bd)}
  .item b{font-family:ui-monospace,monospace}
  .tag{font-size:.8rem;font-weight:700}.free{color:var(--br)}.used{color:#b45309}.rev{color:var(--rose)}
  #msg{min-height:1.2em;font-weight:600}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Panel de licencias</h1>

  <section>
    <label for="pass">Tu clave de administrador</label>
    <input id="pass" type="password" autocomplete="current-password">
    <p id="msg" role="status"></p>
  </section>

  <section>
    <h2>Crear un código nuevo</h2>
    <label for="ref">Nombre del cliente</label>
    <input id="ref" placeholder="Ej: Laura Fernández" maxlength="60">
    <button id="create">Crear código</button>
    <div id="result" hidden>
      <div id="code"></div>
      <div class="row" style="margin-top:10px">
        <button class="sec" id="copy">Copiar</button>
        <a class="btn" id="wa" target="_blank" rel="noopener">Enviar por WhatsApp</a>
      </div>
    </div>
  </section>

  <section>
    <h2>Últimos códigos</h2>
    <div id="list"><p style="color:var(--mu)">Escribí tu clave y tocá "Crear" o "Actualizar lista".</p></div>
    <button class="sec" id="reload">Actualizar lista</button>
  </section>
</main>

<script>
const URL_ = "https://shftrcjmjxvampdahuck.supabase.co";
const KEY = "sb_publishable_jf5p1wMZCBSofo01U8aYlw_7ZLmvpAD";
const APP = "https://quepinquepon.github.io/mascotapro/";
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (t, bad) => { $("msg").textContent = t; $("msg").style.color = bad ? "var(--rose)" : "var(--br)"; };

async function api(action, code, ref) {
  try {
    const r = await fetch(URL_ + "/rest/v1/rpc/admin_license", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: KEY },
      body: JSON.stringify({ p_pass: $("pass").value, p_action: action, p_code: code || null, p_ref: ref || null })
    });
    const d = await r.json();
    if (!d.ok) { say(d.reason === "auth" ? "Clave incorrecta." : "No se pudo completar. Revisá que el paso de SQL esté hecho.", true); return null; }
    say("");
    return d;
  } catch { say("Sin conexión.", true); return null; }
}

async function loadList() {
  const d = await api("list");
  if (!d) return;
  $("list").innerHTML = d.items.length ? d.items.map(i => {
    const st = i.revoked ? ["Anulado", "rev"] : i.used ? ["En uso", "used"] : ["Libre", "free"];
    return `<div class="item"><div><b>${esc(i.code)}</b> · <span class="tag ${st[1]}">${st[0]}</span></div>
      <div style="color:var(--mu)">${esc(i.client_ref) || "Sin nombre"}</div>
      <div class="row">${i.revoked
        ? `<button data-act="release" data-code="${esc(i.code)}">Reactivar (queda libre)</button>`
        : `<button class="sec" data-act="release" data-code="${esc(i.code)}">Liberar celular</button><button class="warn" data-act="revoke" data-code="${esc(i.code)}">Anular</button>`}</div></div>`;
  }).join("") : "<p>Todavía no hay códigos.</p>";
}

$("create").onclick = async () => {
  const ref = $("ref").value.trim();
  if (!ref) { say("Escribí el nombre del cliente.", true); return; }
  const d = await api("create", null, ref);
  if (!d) return;
  $("code").textContent = d.code;
  $("result").hidden = false;
  const txt = `¡Hola! Gracias por adquirir *MascotaPro PRO* 🐾\n\nTu código de acceso personal es:\n*${d.code}*\n\nAbrí ${APP} y tocá "Activar Versión PRO" para ingresarlo. Funciona en un solo celular.`;
  $("wa").href = "https://wa.me/?text=" + encodeURIComponent(txt);
  $("ref").value = "";
  loadList();
};
$("copy").onclick = () => navigator.clipboard.writeText($("code").textContent).then(() => say("Código copiado."));
$("reload").onclick = loadList;
$("list").onclick = async e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const word = b.dataset.act === "revoke" ? "ANULAR" : "dejar libre";
  if (!confirm(`¿Seguro que querés ${word} ${b.dataset.code}?`)) return;
  if (await api(b.dataset.act, b.dataset.code)) { say("Listo."); loadList(); }
};
</script>
</body>
</html>
